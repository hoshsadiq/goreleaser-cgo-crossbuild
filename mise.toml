[tools]
actionlint = "1.7.12"
hadolint = "2.15.1"
shellcheck = "0.11.0"

[tasks.check]
description = "Lint the Dockerfile, the workflow and the shell scripts"
run = [
    "hadolint Dockerfile",
    "actionlint .github/workflows/image.yml",
    "shellcheck test/*.sh",
]

[tasks."image:build"]
description = "Build the crossbuild image for the host architecture"
# The submodule is the musl toolchain recipe. Without it the build fails with
# `make: *** No targets specified and no makefile found. Stop.`, which says nothing
# about the missing submodule, so it is initialised here.
run = "git submodule update --init --recursive && docker buildx build --tag goreleaser-cgo-crossbuild:dev --load ."

[tasks."image:verify"]
description = "Build the image and check every toolchain inside it"
depends = ["image:build"]
run = "docker run --rm -i --entrypoint bash goreleaser-cgo-crossbuild:dev -s < test/verify-toolchains.sh"

[tasks."image:release"]
description = "Run a six-target GoReleaser snapshot release inside the image"
depends = ["image:build"]
run = "test/release-snapshot.sh"
