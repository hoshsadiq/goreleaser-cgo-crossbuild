name: image

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
  # The toolchains come from pinned downloads and a submodule upstream moves on its
  # own schedule, so rebuild weekly rather than only when this repo changes.
  schedule:
    - cron: "0 4 * * 1"

# Cancelling a superseded pull request run is right; cancelling a superseded main or
# tag run would throw away hours of toolchain build and could leave the architecture
# images pushed without a merged index beside them.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  check:
    name: lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install the pinned tools
        uses: jdx/mise-action@94c60b39bc2d90ab2f9bab27f38d3cc4812c1834 # v5.1.0

      - name: hadolint, actionlint, shellcheck
        run: mise run check

  # One job per architecture, each on a native runner. Doing both on one runner puts
  # the whole musl stage under QEMU, which is how two full GCC builds turn into a
  # job that cannot finish inside GitHub's six-hour cap.
  build:
    name: build ${{ matrix.platform }}
    needs: check
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 300
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-24.04
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: recursive

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Built into the runner rather than pushed straight from Buildx, so the two
      # verification steps below can run the image on every path, pull requests
      # included.
      - name: Build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          load: true
          tags: ${{ env.IMAGE }}:${{ matrix.arch }}
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}

      # The point of this repository. A green run here means the six compilers were
      # exercised, not merely copied into place.
      - name: Verify every toolchain
        run: docker run --rm -i --entrypoint bash "${{ env.IMAGE }}:${{ matrix.arch }}" -s < test/verify-toolchains.sh

      # And the point of the compilers: a real six-target cgo release through
      # GoReleaser, which covers Go's linker, cgo, the Darwin dSYM step and the
      # archive formats together.
      - name: Verify a six-target release
        env:
          IMAGE: ${{ env.IMAGE }}:${{ matrix.arch }}
        run: bash test/release-snapshot.sh

      # Pushed under the run id rather than the architecture name, and its digest is
      # handed to the publish job as an artifact, so that job merges exactly what this
      # run built instead of whatever a tag happens to point at. Only on the paths that
      # publish: a branch dispatch builds and verifies without leaving tags behind.
      - name: Push this architecture
        if: github.ref_type == 'tag' || github.ref == 'refs/heads/main'
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail

          tag="${IMAGE}:${GITHUB_RUN_ID}-${ARCH}"
          docker tag "${IMAGE}:${ARCH}" "$tag"
          docker push "$tag"

          digest="$(docker buildx imagetools inspect "$tag" --format '{{json .Manifest}}' | jq -r .digest)"
          printf '%s\n' "$digest" >"digest-${ARCH}.txt"
          echo "pushed ${tag} at ${digest}"

      - name: Record this architecture's digest
        if: github.ref_type == 'tag' || github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: digest-${{ matrix.arch }}
          path: digest-${{ matrix.arch }}.txt
          retention-days: 1

  publish:
    name: publish
    needs: build
    # Tags and main only. A workflow_dispatch on a branch should build and verify
    # without publishing, and a pull request must never reach this job.
    if: github.ref_type == 'tag' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Collect the architecture digests
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: digest-*
          merge-multiple: true
          path: digests

      # Merged from the two digests the build jobs reported, never from a tag: a tag
      # can be overwritten between the two jobs, and this workflow's signature is
      # only worth anything if it signs what the build actually produced.
      - name: Merge the two architectures
        id: merge
        run: |
          set -euo pipefail

          docker buildx imagetools create -t "${IMAGE}:index-${GITHUB_RUN_ID}" \
            "${IMAGE}@$(cat digests/digest-amd64.txt)" \
            "${IMAGE}@$(cat digests/digest-arm64.txt)"
          digest="$(docker buildx imagetools inspect "${IMAGE}:index-${GITHUB_RUN_ID}" \
            --format '{{json .Manifest}}' | jq -r .digest)"
          echo "digest=${digest}" >>"$GITHUB_OUTPUT"
          echo "merged index is ${IMAGE}@${digest}"

      # Digest pinning only means something if the digest came from somewhere a
      # consumer can check, so sign it keylessly with the workflow's own identity.
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign the merged digest
        env:
          DIGEST: ${{ steps.merge.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"

      # Verified before the release tags exist, so a signature that failed to land
      # cannot leave a version tag pointing at an unsigned image.
      - name: Verify the signature
        env:
          DIGEST: ${{ steps.merge.outputs.digest }}
          REPOSITORY: ${{ github.repository }}
        run: |
          cosign verify "${IMAGE}@${DIGEST}" \
            --certificate-identity-regexp "^https://github\.com/${REPOSITORY}/\.github/workflows/image\.yml@" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com

      # A tag push publishes that version; a push to the default branch publishes a
      # rolling latest plus the date and commit, so a consumer can pin something
      # older than latest without waiting for a release.
      - name: Tag the release
        env:
          DIGEST: ${{ steps.merge.outputs.digest }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          args=()
          if [ "$REF_TYPE" = "tag" ]; then
            version="${REF_NAME#v}"
            args+=(-t "${IMAGE}:${version}")
            args+=(-t "${IMAGE}:${version%.*}")
          else
            args+=(-t "${IMAGE}:latest")
            args+=(-t "${IMAGE}:$(date -u +%Y%m%d)")
            args+=(-t "${IMAGE}:sha-${GITHUB_SHA:0:7}")
          fi

          docker buildx imagetools create "${args[@]}" "${IMAGE}@${DIGEST}"

      - name: Report the digest
        env:
          DIGEST: ${{ steps.merge.outputs.digest }}
          REPOSITORY: ${{ github.repository }}
        run: |
          {
            echo "### \`${IMAGE}@${DIGEST}\`"
            echo
            echo '```'
            echo "cosign verify ${IMAGE}@${DIGEST} \\"
            echo "  --certificate-identity-regexp '^https://github\\.com/${REPOSITORY}/\\.github/workflows/image\\.yml@' \\"
            echo "  --certificate-oidc-issuer https://token.actions.githubusercontent.com"
            echo '```'
          } >>"$GITHUB_STEP_SUMMARY"
