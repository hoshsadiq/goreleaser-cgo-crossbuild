name: image

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
  # The toolchains come from pinned downloads and a submodule that upstream moves
  # on its own schedule, so rebuild weekly rather than only when this repo changes.
  schedule:
    - cron: "0 4 * * 1"

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tags and labels
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value={{date 'YYYYMMDD'}},enable={{is_default_branch}}
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=pr
            type=sha

      # A pull request builds amd64 only: the two musl toolchains take an hour
      # between them, and the arm64 leg of a PR is not worth that. Everything
      # that publishes builds both.
      - name: Build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ github.event_name == 'pull_request' && 'linux/amd64' || 'linux/amd64,linux/arm64' }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true

      # Consumers pin by digest, so surface it rather than making them dig.
      - name: Report the digest
        if: github.event_name != 'pull_request'
        env:
          REPOSITORY: ${{ github.repository }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          reference="ghcr.io/${REPOSITORY}:${VERSION}"
          digest="$(docker buildx imagetools inspect "$reference" --format '{{json .Manifest}}' | jq -r .digest)"
          {
            echo "### $reference"
            echo
            echo '```'
            echo "ghcr.io/${REPOSITORY}@${digest}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
