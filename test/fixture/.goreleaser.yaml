# A six-target cgo release, so that a green `mise run image:release` means the whole
# path works: GoReleaser, the Go toolchain, cgo, and every C compiler in the image.
# Deliberately close to a real consumer's config, including the explicit CC_/CXX_
# list, because `index` on a missing key returns an empty string rather than failing.
version: 2

project_name: fixture

env:
  - CGO_ENABLED=1
  - CC_linux_amd64=/usr/local/bin/x86_64-linux-musl-gcc
  - CXX_linux_amd64=/usr/local/bin/x86_64-linux-musl-g++
  - CC_linux_arm64=/usr/local/bin/aarch64-linux-musl-gcc
  - CXX_linux_arm64=/usr/local/bin/aarch64-linux-musl-g++
  - CC_darwin_amd64=/usr/local/osxcross/bin/o64-clang
  - CXX_darwin_amd64=/usr/local/osxcross/bin/o64-clang++
  - CC_darwin_arm64=/usr/local/osxcross/bin/oa64-clang
  - CXX_darwin_arm64=/usr/local/osxcross/bin/oa64-clang++
  - CC_windows_amd64=/llvm-mingw/bin/x86_64-w64-mingw32-gcc
  - CXX_windows_amd64=/llvm-mingw/bin/x86_64-w64-mingw32-g++
  - CC_windows_arm64=/llvm-mingw/bin/aarch64-w64-mingw32-gcc
  - CXX_windows_arm64=/llvm-mingw/bin/aarch64-w64-mingw32-g++

builds:
  - id: fixture
    main: .
    binary: fixture
    env:
      - 'CC={{ index .Env (print "CC_" .Os "_" .Arch) }}'
      - 'CXX={{ index .Env (print "CXX_" .Os "_" .Arch) }}'
    flags:
      - -trimpath
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    # Deliberately not stripped. Go calls dsymutil for an unstripped darwin cgo
    # build, so keeping -s -w out of here is what makes this test catch a release
    # image that is missing it.
    ldflags:
      - '{{ if eq .Os "linux" }}-extldflags "-static"{{ end }}'

archives:
  - id: fixture
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip

checksum:
  name_template: fixture_checksums.txt

changelog:
  disable: true
